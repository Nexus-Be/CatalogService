# =============================================================================
# NEXUS CATALOG SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Catalog Service:
#   CSDL chính lưu trên PostgreSQL cục bộ (port 5434 hoặc nexus-catalog-db)
#   docker compose up -d
# =============================================================================

services:

  # 1. Ứng dụng Catalog Service RESTful Web API (Port 8002)
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-catalog-service
    ports:
      - "${CATALOG_SERVICE_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${CATALOG_CONNECTION_STRING:-${CONNECTION_STRING:-Host=catalog-db;Port=5432;Database=catalog_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}}}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-guest}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    restart: unless-stopped

networks:
  default:
    name: nexus-network
