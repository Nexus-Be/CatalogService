# =============================================================================
# NEXUS CATALOG SERVICE - DOCKER COMPOSE
# =============================================================================
# Khởi chạy độc lập Catalog Service kèm Cơ sở dữ liệu riêng:
#   docker compose up -d
# =============================================================================

services:

  # 1. Cơ sở dữ liệu Catalog Service (Port 5434)
  catalog-db:
    image: postgres:16-alpine
    container_name: nexus-catalog-db
    environment:
      POSTGRES_DB: category_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MatkhaucuaTui123@}
    ports:
      - "${CATALOG_DB_PORT:-5434}:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d category_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Ứng dụng Catalog Service gRPC (Port 8002)
  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-catalog-service
    ports:
      - "${CATALOG_SERVICE_PORT:-8002}:8002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=catalog-db;Port=5432;Database=category_db;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-MatkhaucuaTui123@}
      - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
      - RabbitMq__Port=${RABBITMQ_PORT:-5672}
      - RabbitMq__User=${RABBITMQ_USER:-guest}
      - RabbitMq__Password=${RABBITMQ_PASSWORD:-MatkhaucuaTui123@}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4317}
    depends_on:
      catalog-db:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: nexus-network

volumes:
  catalog_db_data:
    name: nexus-be_catalog_db_data
